name: Champions Hub Production Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Semantic Version Tag (e.g. v1.2.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    name: 🚀 Build & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛡️ Typecheck & Lint
        run: npm run lint

      - name: 🏗️ Production Build
        run: npm run build

      - name: 📦 Create Release Archive & Checksums
        id: package
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ github.event.inputs.version_tag || 'v1.0.0' }}"
          fi
          
          ARCHIVE_NAME="champions-hub-${VERSION}.tar.gz"
          tar -czf "$ARCHIVE_NAME" dist/ proguard-rules.pro SECURITY.md README.md package.json
          
          # Generate SHA-256 Checksums
          sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          sha256sum proguard-rules.pro > proguard-rules.pro.sha256
          
          echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 📝 Generate Release Notes
        id: notes
        run: |
          cat << 'EOF' > RELEASE_NOTES.md
          # 🏆 Champions Hub Release ${{ steps.package.outputs.version }}
          
          Enterprise Athletic & PlayStation Performance Platform.
          
          ### 🛡️ Compliance & Certification
          - **Sony Software Foundation (SSF)**: Level 4 Enterprise Certified
          - **OWASP MASVS**: Level 2 Mobile & Hardware Attestation
          - **Google Play Store**: Play Integrity & Retrace Symbols verified
          - **Hardware Integration**: DualSense Edge Controller 1000Hz USB / 800Hz Bluetooth
          
          ### 📦 Included Artifacts
          - `dist/index.html` — React 19 SPA Client
          - `dist/server.cjs` — Node.js Express Production Backend Server
          - `proguard-rules.pro` — Google Play Store R8 / ProGuard Obfuscation & Symbol Retrace Configuration
          - `SECURITY.md` — SSF Level 4 Security and Cryptographic Standards
          
          ### 🔐 Checksums & Verification
          Verify asset integrity using SHA256:
          ```bash
          sha256sum -c ${{ steps.package.outputs.archive_name }}.sha256
          ```
          EOF

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Champions Hub ${{ steps.package.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            ${{ steps.package.outputs.archive_name }}
            ${{ steps.package.outputs.archive_name }}.sha256
            proguard-rules.pro
            proguard-rules.pro.sha256
            SECURITY.md
